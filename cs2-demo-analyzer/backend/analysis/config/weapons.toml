# Параметры оружия CS2 для анализа контрстрейфов.
#
# Ключ — имя класса из события weapon_fire без префикса "weapon_"
# (в демке оно приходит как "weapon_ak47", "weapon_m4a1_silencer" и т.д.).
#
# max_speed         — максимальная скорость бега с этим оружием в руках (юнитов/с).
# scoped_max_speed  — максимальная скорость в прицеле (только у оружия с оптикой).
# category          — rifle | smg | pistol | sniper | heavy | shotgun
#
# Порог точности = accuracy_speed_ratio (см. thresholds.toml) * max_speed
# (или * scoped_max_speed, если игрок в прицеле).

[ak47]
name = "AK-47"
category = "rifle"
max_speed = 215

