name: ProSetup Launcher EXE

on:
  push:
    branches: [claude/prosetup-launcher]
    paths:
      - "prosetup-launcher/**"
      - ".github/workflows/prosetup-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: prosetup-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.3"

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ProSetupLauncher --icon assets/icon.ico
          --exclude-module tkinter main.py

      - name: Self-test the built EXE on Windows
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\ProSetupLauncher.exe" -ArgumentList "--selftest", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) {
            Write-Host "Self-test timed out, killing"
            Get-Process ProSetupLauncher -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path $report) { Get-Content $report -Encoding UTF8 }
            exit 1
          }
          if (Test-Path $report) { Get-Content $report -Encoding UTF8 } else { Write-Host "No report written" }
          Write-Host "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ProSetupLauncher
          path: prosetup-launcher/dist/ProSetupLauncher.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prosetup-launcher-latest
          name: ProSetup Launcher
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Готовый ProSetup Launcher для Windows 10/11 — Python не нужен.
            Скачайте ProSetupLauncher.exe и запустите. Настройки сохраняются
            в папке ProSetupLauncher-data рядом с EXE (удобно для флешки).
          files: prosetup-launcher/dist/ProSetupLauncher.exe
